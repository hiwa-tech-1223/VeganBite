version: 2
updates:
  # Go モジュール
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # npm
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Docker ベースイメージ（golang / distroless / node）
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Terraform provider（community provider の neon はメジャー・マイナー更新を必ず目視で確認する）
  - package-ecosystem: terraform
    directories:
      - /infra/environments/dev
      - /infra/modules/cloudrun-service
      - /infra/modules/neon-database
    schedule:
      interval: weekly
